name: PhoneCam
options:
  deploymentTarget:
    macOS: "14.0"
# DEVELOPMENT_TEAM and BUNDLE_ID_PREFIX come from these (see Config/Signing.xcconfig).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  PhoneCam:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Resources/scrcpy-server
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PhoneCam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.video
        NSCameraUsageDescription: PhoneCam sends your phone's video into the PhoneCam camera.
    entitlements:
      path: App/PhoneCam.entitlements
      properties:
        com.apple.developer.system-extension.install: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PhoneCam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CameraExtension
        embed: true

  CameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - Extension
      - Shared
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: PhoneCam Camera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        NSSystemExtensionUsageDescription: Provides the PhoneCam camera that shows your phone's video.
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).PhoneCam.CameraExtension
    entitlements:
      path: Extension/CameraExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).PhoneCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PhoneCam.CameraExtension
        # A system extension's bundle must be named after its identifier.
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        SKIP_INSTALL: YES
